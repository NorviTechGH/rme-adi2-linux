# Per-stream native-rate switching for the RME ADI-2 DAC.
#
# Without `default.clock.allowed-rates`, Pipewire is locked to one rate
# (48 kHz here) and SRC-resamples everything else — including all 44.1 kHz
# music (Spotify, Apple Music, FLAC, CD rips). Listing the rates we care
# about lets Pipewire reclock the DAC to match the source whenever a
# single stream owns the sink, so 44.1 plays at 44.1 and the DAC stays
# bit-perfect end-to-end.
#
# When two streams of different rates are active simultaneously, the
# graph still has to resample one of them; resample.quality = 10 (max,
# windowed-sinc, ~256 taps) keeps that fallback transparent.
context.properties = {
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]
}

stream.properties = {
    resample.quality = 10
}
