# Hide the ADI-2 DAC's USB capture/loopback input node when the unit is
# used purely as a playback DAC (sink stays active). Remove this file if
# you record from the ADI-2's USB loopback.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input\\.usb-RME_ADI-2_DAC.*\\.analog-stereo$" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
