# Per-node rate switching for the RME ADI-2 DAC.
#
# `default.clock.allowed-rates` in pipewire.conf controls the *graph*,
# but each ALSA node also has its own `audio.allowed-rates` which
# defaults to empty — and an empty per-node list pins the device to
# `clock.rate` (48 kHz) regardless of source. We need to populate it
# on the RME's sink/source nodes so PipeWire actually reclocks the DAC
# when a stream arrives at a different native rate.
#
# `resample.quality = 10` only takes effect at the *node* — the
# stream.properties version in pipewire.conf doesn't propagate here.
#
# `session.suspend-timeout-seconds = 5` lets the node go idle quickly
# after a stream ends, which is the window in which PipeWire is allowed
# to re-pick the rate for the next stream. Without suspend, the device
# stays warm at the previous rate and the next mismatched stream gets
# resampled.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_(output|input).usb-RME_ADI-2_DAC.*" }
    ]
    actions = {
      update-props = {
        audio.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]
        audio.format = "S32LE"
        resample.quality = 10
        session.suspend-timeout-seconds = 5
        node.pause-on-idle = false
      }
    }
  }
]
